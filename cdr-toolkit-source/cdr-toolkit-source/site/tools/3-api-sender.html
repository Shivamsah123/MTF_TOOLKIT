<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>API Request Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --border:#d9dde3;
          --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --code:#f1f3f6; }
  
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  select, input, textarea, button { font: inherit; color: var(--text); }
  select, input, textarea { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 10px; }
  select { width: 120px; font-weight: 600; }
  input#url { flex:1; min-width: 200px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 20px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--border); padding:6px 12px; font-weight:500; }
  button:disabled { opacity:.6; cursor:wait; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  textarea { width:100%; min-height:110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13px; resize:vertical; }
  .bar { display:flex; justify-content:space-between; align-items:center; }
  .meta { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; margin-bottom:10px; }
  .badge { font-weight:700; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  pre { background:var(--code); border:1px solid var(--border); border-radius:8px; padding:12px; margin:0;
        overflow:auto; max-height:420px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { padding:5px 12px; border-radius:6px; border:1px solid var(--border); cursor:pointer; font-size:13px; background:transparent; color:var(--text); font-weight:500; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  #warn { display:none; background:#fef3c7; color:#92400e; border-radius:8px; padding:8px 12px; font-size:13px; margin-top:12px; }
  .key { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .key input { width:200px; padding:6px 10px; }
</style>
<style>html,body{background:#fff!important;color-scheme:light}html{overflow-y:hidden!important}</style><script>(function(){function s(){var b=document.body,c=getComputedStyle(b);var h=b.offsetHeight+parseFloat(c.marginTop||0)+parseFloat(c.marginBottom||0);try{parent.postMessage({cdrHeight:Math.ceil(h)+2},"*")}catch(e){}}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.documentElement);setInterval(s,400)})()</script></head>
<body>
<div class="wrap">
  <div class="top">
    <h1>API Request Sender</h1>
  </div>

  <div class="card">
    <div class="row">
      <select id="method">
        <option>GET</option><option>POST</option><option>PUT</option>
        <option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
      </select>
      <input id="url" placeholder="https://api.example.com/users/123" spellcheck="false">
      <button id="send">Send</button>
    </div>
    <div id="warn">This request can change or delete data. If this is a production URL, double-check the URL and body first.</div>

    <label>Authorization</label>
    <div class="row">
      <select id="authType" style="width:150px">
        <option value="none">No Auth</option>
        <option value="bearer">Bearer Token</option>
        <option value="basic">Basic Auth</option>
        <option value="apikey">API Key (header)</option>
      </select>
      <input id="authToken" placeholder="Enter token" style="flex:1; min-width:160px" spellcheck="false" autocomplete="off">
      <input id="authUser" placeholder="Username" style="display:none; width:160px" autocomplete="off">
      <input id="authPass" type="password" placeholder="Password" style="display:none; width:160px" autocomplete="off">
      <input id="authKeyName" placeholder="Header name (x-api-key)" style="display:none; width:200px" spellcheck="false">
    </div>
    <div class="hint">Whatever you enter here is sent with the request as the Authorization header.</div>

    <label>Headers (JSON)</label>
    <textarea id="headers" spellcheck="false">{
  "Content-Type": "application/json"
}</textarea>

    <div class="bar"><label style="margin-bottom:0">Body (JSON)</label>
      <span><button class="ghost" id="load" type="button">Use JSON from converter</button> <button class="ghost" id="fmt" type="button">Format JSON</button></span></div>
    <textarea id="body" spellcheck="false" style="margin-top:6px">{
  "name": "test"
}</textarea>
    <div class="hint">GET / HEAD requests do not send a body.</div>
  </div>

  <div class="card" id="resCard" style="display:none">
    <div class="meta" id="meta"></div>
    <div class="tabs">
      <button class="tab active" data-t="body">Body</button>
      <button class="tab" data-t="headers">Headers</button>
    </div>
    <pre id="resOut"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let last = null, tab = "body";


function updateWarn() {
  $("warn").style.display = ["PUT","PATCH","DELETE","POST"].includes($("method").value) ? "block" : "none";
}
$("method").addEventListener("change", updateWarn);
updateWarn();

function updateAuth() {
  const t = $("authType").value;
  $("authToken").style.display   = (t === "bearer" || t === "apikey") ? "" : "none";
  $("authUser").style.display    = t === "basic" ? "" : "none";
  $("authPass").style.display    = t === "basic" ? "" : "none";
  $("authKeyName").style.display = t === "apikey" ? "" : "none";
  $("authToken").placeholder = t === "apikey" ? "API key value" : "Enter token";
}
$("authType").addEventListener("change", updateAuth);
$("authType").value = "bearer";
updateAuth();

$("load").onclick = () => {
  let v = ""; try { v = parent.getJsonOut(); } catch {}
  if (v) $("body").value = v; else alert("The converter has no JSON yet. Convert a file in \"Excel to JSON\" first.");
};
$("fmt").onclick = () => {
  try { $("body").value = JSON.stringify(JSON.parse($("body").value), null, 2); }
  catch (e) { alert("Body is not valid JSON: " + e.message); }
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active"); tab = t.dataset.t; render();
});

function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }

function render() {
  if (!last) return;
  $("resCard").style.display = "block";
  if (last.error) {
    $("meta").innerHTML = '<span class="badge err">Request failed</span>';
    $("resOut").textContent = last.error; return;
  }
  const cls = last.status >= 200 && last.status < 300 ? "ok" : "err";
  $("meta").innerHTML =
    '<span class="badge ' + cls + '">' + last.status + " " + last.reason + "</span>" +
    "<span>" + last.time_ms + " ms</span><span>" + last.size + " bytes</span>";
  $("resOut").textContent = tab === "body"
    ? pretty(last.body)
    : Object.entries(last.headers).map(([k, v]) => k + ": " + v).join("\n");
}

$("send").onclick = async () => {
  let headers = {};
  try { headers = $("headers").value.trim() ? JSON.parse($("headers").value) : {}; }
  catch (e) { alert("Headers are not valid JSON: " + e.message); return; }

  const at = $("authType").value;
  if (at === "bearer" && $("authToken").value.trim()) {
    headers["Authorization"] = "Bearer " + $("authToken").value.trim();
  } else if (at === "basic") {
    const bytes = new TextEncoder().encode($("authUser").value + ":" + $("authPass").value);
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    headers["Authorization"] = "Basic " + btoa(bin);
  } else if (at === "apikey" && $("authToken").value.trim()) {
    headers[$("authKeyName").value.trim() || "x-api-key"] = $("authToken").value.trim();
  }

  const method = $("method").value;
  const url = $("url").value.trim();
  if (!url) { alert("Enter the URL"); return; }
  const body = ["GET","HEAD"].includes(method) ? "" : $("body").value;

  $("send").disabled = true; $("send").textContent = "Sending...";
  try {
    const r = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, method, headers, body })
    });
    if (r.status === 401) { top.location.href = "/login"; return; }
    const txt = await r.text();
    try { last = JSON.parse(txt); }
    catch { last = { error: "The server did not return JSON (HTTP " + r.status + "). /api/send was not found or crashed. Check that api/send.js is deployed and ACCESS_KEY is set. Response: " + txt.slice(0, 200) }; }
  } catch (e) {
    last = { error: location.protocol === "file:"
      ? "This page was opened as a local file, so /api/send does not exist. Open your deployed Vercel URL, or run `node local.js` and open http://localhost:3000."
      : "Could not reach /api/send (" + e.message + "). Open this tool from your deployed Vercel site (same domain) and check your internet connection or any ad-blocker." };
  }
  $("send").disabled = false; $("send").textContent = "Send";
  render();
};
</script>
</body>
</html>
