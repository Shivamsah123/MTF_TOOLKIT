<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | CDR Toolkit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:#edf1f8;color:#1c2430;font:16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:1200px;display:grid;grid-template-columns:1fr 1fr;background:#fff;box-shadow:0 30px 60px -20px rgba(31,45,77,.35)}
.photo{background:url(assets/photo.jpg) center/cover no-repeat;min-height:560px}
.right{display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px}
.logo{width:310px;max-width:80%;height:auto;margin-bottom:56px}
form{width:100%;max-width:610px;display:flex;flex-direction:column;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{width:100%;height:66px;margin-bottom:20px;border:0;border-radius:4px;background:#e8f0fe;box-shadow:0 1px 3px rgba(31,45,77,.18);text-align:center;font:inherit;font-size:1.05rem;color:#000}
input::placeholder{color:#6b7a90}input:focus{outline:2px solid #fe0168;outline-offset:0}
button{width:250px;height:61px;margin-top:6px;border:0;border-radius:4px;background:#fe0168;color:#fff;font:inherit;font-weight:500;letter-spacing:.02em;cursor:pointer}
button:hover:not(:disabled){background:#e00059}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #1c2430;outline-offset:2px}
#err{min-height:1.5em;margin:14px 0 0;color:#c0152f;font-size:.95rem;text-align:center}
.foot{background:#f6f6f6;border-top:1px solid #e6e6e6;padding:30px 20px;text-align:center}
.foot a{color:#82aadb;text-decoration:none;cursor:pointer}.foot a:hover{text-decoration:underline}
#fp{margin:8px 0 0;color:#6b7a90;font-size:.9rem;display:none}
.copy{margin-top:18px;color:#8a8f98;font-size:.95rem;text-align:center}
@media(max-width:900px){.card{grid-template-columns:1fr}.photo{display:none}.logo{margin-bottom:36px}}
</style></head><body>
<div class="card">
  <div class="photo" role="img" aria-label=""></div>
  <div class="right">
    <div class="main">
      <img class="logo" src="assets/logo.png" alt="waanee.ai - Power of Choice">
      <form id="f" autocomplete="on">
        <label class="sr" for="u">Username</label><input id="u" name="username" placeholder="Username" autocomplete="username" required autofocus>
        <label class="sr" for="p">Password</label><input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button id="b" type="submit">LOG IN</button>
        <p id="err" role="alert"></p>
      </form>
    </div>
    <div class="foot"><a id="fl" role="button" tabindex="0">Forgot Password</a><p id="fp">Please contact your administrator to reset the password.</p></div>
  </div>
</div>
<div class="copy">&copy; <span id="y"></span> Waanee AI Private Limited.</div>
<script>
if(top!==self)top.location.href='/login';
document.getElementById('y').textContent=new Date().getFullYear();
const $=id=>document.getElementById(id);
const showFp=()=>{$('fp').style.display='block'};$('fl').onclick=showFp;$('fl').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')showFp()};
$('f').onsubmit=async e=>{
 e.preventDefault();$('b').disabled=true;$('err').textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok){location.replace('/');return}
  $('err').textContent=j.error||'Login failed.';
 }catch(x){$('err').textContent='Could not reach the server. Check your connection.'}
 $('b').disabled=false;
};
</script></body></html>
