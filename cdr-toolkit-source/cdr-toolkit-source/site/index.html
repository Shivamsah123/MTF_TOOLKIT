<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDR Toolkit</title>
<style>
:root{--ink:#14202b;--mute:#5b6b79;--line:#e2e8ed;--accent:#0b6e99;--soft:#eef6fa}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:baseline;gap:12px}
header b{font-size:1.15rem;letter-spacing:-.01em}header span{color:var(--mute);font-size:.9rem}header button{margin-left:auto;font:inherit;font-size:.9rem;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}header button:hover{background:#f5f8fa}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;margin-bottom:4px;font:inherit;color:var(--ink);cursor:pointer}
nav button:hover{background:#f5f8fa}nav button[aria-current=true]{background:var(--soft);color:var(--accent)}
nav .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--mute);margin-top:1px}
nav button[aria-current=true] .n{background:var(--accent);border-color:var(--accent);color:#fff}
nav strong{display:block;font-size:.95rem;font-weight:600}nav small{display:block;color:var(--mute);font-size:.8rem;line-height:1.3}
main{min-width:0}iframe{display:none;width:100%;border:0;background:#fff;min-height:300px;overflow:hidden}iframe.on{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
nav button{width:auto;flex:none;white-space:nowrap;margin:0;padding:8px 12px;border:1px solid var(--line)}nav small{display:none}}
</style></head><body>
<header><b>CDR Toolkit</b><span>Six converters in one place. File tools run in your browser; only the API sender uses the server.</span><button id="out" type="button">Log out</button></header>
<div id="fileWarn" hidden style="background:#fef3c7;color:#92400e;padding:8px 20px;font-size:.9rem">You opened this as a local file. The API Request Sender needs a server: use your Vercel URL or run <code>node local.js</code>.</div>
<div class="layout"><nav id="nav" aria-label="Tools"></nav><main id="main"></main></div>
<script>
const FILES=["1-disposition-remark", "2-excel-to-json", "3-api-sender", "4-answer-null-cdr", "5-lead-to-answer-null", "6-sub-disposition-pivot"],M=[["Disposition Remark Converter", "CDR CSV, filter, add remarks, export Excel"], ["Excel to JSON", "Convert Excel or CSV into call JSON"], ["API Request Sender", "Send JSON to any API through your Vercel server"], ["Download Answer Null CDR", "Filter CDR to Answer + null disposition rows"], ["Answer Null Lead Data", "Build the Answer Null file from lead data"], ["Sub-Disposition Pivot", "Pivot table and connectivity summary"]],nav=document.getElementById('nav'),main=document.getElementById('main');
let cur=-1;const frames=[];
M.forEach((m,i)=>{
 const b=document.createElement('button');b.innerHTML='<span class="n">'+(i+1)+'</span><span><strong>'+m[0]+'</strong><small>'+m[1]+'</small></span>';
 b.onclick=()=>show(i);nav.appendChild(b);
 const f=document.createElement('iframe');f.id='f'+(i+1);f.setAttribute('scrolling','no');f.title=m[0];f.setAttribute('allow','clipboard-write; clipboard-read');main.appendChild(f);frames.push(f);
});
function show(i){
 cur=i;frames.forEach((f,k)=>{f.classList.toggle('on',k===i);if(k===i&&!f.getAttribute('src'))f.src='tools/'+FILES[k]+'.html'});
 [...nav.children].forEach((b,k)=>b.setAttribute('aria-current',k===i));
 history.replaceState(null,'','#'+(i+1));window.scrollTo(0,0);
}
function getJsonOut(){try{return frames[1].contentDocument.querySelector('#out').value}catch(e){return ''}}
addEventListener('message',e=>{if(!e.data||!e.data.cdrHeight)return;frames.forEach(f=>{if(f.contentWindow===e.source)f.style.height=e.data.cdrHeight+'px'})});
if(location.protocol==='file:')document.getElementById('fileWarn').hidden=false;
document.getElementById('out').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}catch(e){}location.href='/login'};
const start=parseInt(location.hash.slice(1),10);show(start>=1&&start<=M.length?start-1:0);
</script></body></html>
